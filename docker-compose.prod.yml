name: dias

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [dias_net]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [dias_net]
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: dias-backend:latest
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      PGHOST: db
      PGPORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_files:/app/staticfiles
    expose:
      - "8000"
    networks: [dias_net]
    logging: *default-logging

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: dias-nginx:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Готовый билд SPA с сервера (scp/rsync) — без пересборки образа
      - ${FRONTEND_DIST:-./frontend-dist}:/usr/share/nginx/html:ro
      - static_files:/var/www/dias/static:ro
    networks: [dias_net]
    logging: *default-logging

volumes:
  pg_data:
  redis_data:
  static_files:

networks:
  dias_net:
    driver: bridge
