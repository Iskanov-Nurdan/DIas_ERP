# Общие параметры проксирования в Django (daphne).
proxy_pass http://dias_backend;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $dias_request_id;   # связывает лог nginx с логом Django
proxy_set_header Connection        "";
# Если бэкенд лежит — 502 сразу, а не через 60 с (дефолт nginx)
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering off;
proxy_redirect off;
