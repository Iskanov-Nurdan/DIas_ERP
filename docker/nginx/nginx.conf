# DIAS — reverse proxy: SPA + Django API (HTTP) + Channels (WebSocket).

upstream dias_backend {
    server backend:8000;
    keepalive 32;
}

# Rate limiting на периметре: логин — жёстко, остальное API — с запасом
# (в DRF есть собственный throttling, см. DEFAULT_THROTTLE_RATES).
limit_req_zone $binary_remote_addr zone=dias_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dias_api:10m rate=30r/s;

log_format dias_log '$remote_addr [$time_local] "$request" '
                    'status=$status upstream=$upstream_status bytes=$body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    'rid=$dias_request_id ref="$http_referer" ua="$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Сквозной идентификатор запроса: берём из заголовка клиента, иначе генерим свой.
# Он же уходит в бэкенд (X-Request-Id), попадает в лог Django (request_id=...)
# и возвращается фронту в заголовке ответа — по нему связываются все три лога.
map $http_x_request_id $dias_request_id {
    default $http_x_request_id;
    ''      $request_id;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    charset utf-8;
    server_tokens off;

    # ——— Security headers ———
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ——— Gzip ———
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/vnd.api+json image/svg+xml;

    # status — что вернул клиент, upstream — что ответил Django (502 = бэкенд не ответил вовсе),
    # rt/urt — где потерялось время (nginx или бэкенд), rid — ключ для поиска в логах Django.
    access_log /var/log/nginx/access.log dias_log;
    error_log  /var/log/nginx/error.log warn;

    # Бэкенд не ответил — отдаём JSON, а не HTML-страницу nginx: фронт распарсит,
    # и в ответе останется request_id для поиска причины в логах.
    error_page 502 503 504 = @backend_down;

    location @backend_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Request-Id $dias_request_id always;
        return 502 '{"code":"backend_unavailable","error":"Сервис временно недоступен","detail":"Бэкенд не ответил (upstream=$upstream_status). Проверьте: docker compose logs backend","request_id":"$dias_request_id"}';
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ——— WebSocket (Channels): /ws/operational ———
    location /ws/ {
        proxy_pass http://dias_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Request-Id      $dias_request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ——— Логин: отдельный лимит, со слешем и без ———
    location ~ ^/api/auth/login/?$ {
        limit_req zone=dias_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=dias_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /health/ {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /admin/   { include /etc/nginx/snippets/proxy.conf; }
    location /swagger/ { include /etc/nginx/snippets/proxy.conf; }

    # Алиасы без префикса /api/ (см. config/urls.py)
    location /users/     { include /etc/nginx/snippets/proxy.conf; }
    location /materials/ { include /etc/nginx/snippets/proxy.conf; }
    location /warehouse/ { include /etc/nginx/snippets/proxy.conf; }
    location /batches/   { include /etc/nginx/snippets/proxy.conf; }

    # ——— /static/ — общий префикс у SPA (CRA кладёт туда js/css) и у Django admin.
    # Сначала ищем файл в билде фронта, потом в собранной статике Django. ———
    location /static/ {
        root /usr/share/nginx/html;          # → /usr/share/nginx/html/static/...
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @django_static;
    }

    location @django_static {
        root /var/www/dias;                  # → /var/www/dias/static/... (volume static_files)
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ——— SPA: хэшированные ассеты Vite кэшируем надолго, index.html — никогда ———
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
