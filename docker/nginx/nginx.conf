# DIAS — reverse proxy: SPA + Django API (HTTP) + Channels (WebSocket).

upstream dias_backend {
    server backend:8000;
    keepalive 32;
}

# Rate limiting на периметре: логин — жёстко, остальное API — с запасом
# (в DRF есть собственный throttling, см. DEFAULT_THROTTLE_RATES).
limit_req_zone $binary_remote_addr zone=dias_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dias_api:10m rate=30r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    charset utf-8;
    server_tokens off;

    # ——— Security headers ———
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ——— Gzip ———
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/vnd.api+json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ——— WebSocket (Channels): /ws/operational ———
    location /ws/ {
        proxy_pass http://dias_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ——— Логин: отдельный лимит, со слешем и без ———
    location ~ ^/api/auth/login/?$ {
        limit_req zone=dias_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=dias_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /health/ {
        access_log off;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /admin/   { include /etc/nginx/snippets/proxy.conf; }
    location /swagger/ { include /etc/nginx/snippets/proxy.conf; }

    # Алиасы без префикса /api/ (см. config/urls.py)
    location /users/     { include /etc/nginx/snippets/proxy.conf; }
    location /materials/ { include /etc/nginx/snippets/proxy.conf; }
    location /warehouse/ { include /etc/nginx/snippets/proxy.conf; }
    location /batches/   { include /etc/nginx/snippets/proxy.conf; }

    # ——— /static/ — общий префикс у SPA (CRA кладёт туда js/css) и у Django admin.
    # Сначала ищем файл в билде фронта, потом в собранной статике Django. ———
    location /static/ {
        root /usr/share/nginx/html;          # → /usr/share/nginx/html/static/...
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @django_static;
    }

    location @django_static {
        root /var/www/dias;                  # → /var/www/dias/static/... (volume static_files)
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ——— SPA: хэшированные ассеты Vite кэшируем надолго, index.html — никогда ———
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
